name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/noobping/pipeline

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: bootstrap Pipeline
        run: cargo build --locked --release

      - name: build with Pipeline
        run: target/release/pipeline --cap-jobs 4 build

      - name: package binary
        run: |
          mkdir -p dist
          cp target/release/pipeline dist/pipeline-linux-${{ matrix.arch }}
          chmod +x dist/pipeline-linux-${{ matrix.arch }}
          cd dist
          sha256sum pipeline-linux-${{ matrix.arch }} > pipeline-linux-${{ matrix.arch }}.sha256

      - name: build container
        run: docker build --pull --tag "${IMAGE_NAME}:${{ matrix.arch }}-${GITHUB_SHA}" .

      - name: test container
        run: tests/container.sh "${IMAGE_NAME}:${{ matrix.arch }}-${GITHUB_SHA}"

      - name: test action
        uses: ./
        with:
          working-directory: tests/action/fixture with spaces

      - name: verify action output
        run: |
          test "$(cat 'tests/action/fixture with spaces/action-output')" = action-ok
          rm -f 'tests/action/fixture with spaces/action-output'

      - name: log in to the container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push architecture container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${IMAGE_NAME}:${{ matrix.arch }}-${GITHUB_SHA}"

      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-linux-${{ matrix.arch }}
          path: |
            dist/pipeline-linux-${{ matrix.arch }}
            dist/pipeline-linux-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      GH_REPO: ${{ github.repository }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish multi-architecture container
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:continuous" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:amd64-${GITHUB_SHA}" \
            "${IMAGE_NAME}:arm64-${GITHUB_SHA}"

      - name: move continuous tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/continuous" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous" \
              --field sha="$GITHUB_SHA" \
              --field force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref=refs/tags/continuous \
              --field sha="$GITHUB_SHA" >/dev/null
          fi

      - name: create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous \
              --title "Continuous Release" \
              --notes "Latest build from main: $GITHUB_SHA" \
              --latest=true
          else
            gh release create continuous \
              --title "Continuous Release" \
              --notes "Latest build from main: $GITHUB_SHA" \
              --latest=true
          fi

      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload continuous \
            dist/pipeline-linux-amd64 \
            dist/pipeline-linux-amd64.sha256 \
            dist/pipeline-linux-arm64 \
            dist/pipeline-linux-arm64.sha256 \
            --clobber
