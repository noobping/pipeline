[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["noobping"]
description = "A small Just-powered pipeline runner"
repository = "https://github.com/noobping/pipeline"
publish = false

[package.metadata.pipeline]
just-image = "ghcr.io/casey/just:latest"
just-min-version = "1.56.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
clap = { version = "4.6", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
yaml_serde = "0.10"

[build-dependencies]
toml = "1"
